name: Actualizar tarjetas de estadísticas

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 00:00 de CDMX
  workflow_dispatch:       # botón para correrlo a mano

jobs:
  tarjetas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Mata13&show_icons=true&theme=algolia&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Mata13&layout=compact&langs_count=8&theme=algolia
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar las tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizo tarjetas de estadísticas" || exit 0
          git push
